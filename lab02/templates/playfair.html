<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playfair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .playfair-grid-table {
            width: 220px;
            height: 220px;
            margin: 0 auto;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        .playfair-grid-table td {
            width: 44px;
            height: 44px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #a78bfa;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            vertical-align: middle;
            transition: all 0.2s ease;
        }
        .playfair-grid-table td:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="cipher-container">
        <div class="logo-container mt-3">
            <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="hutech" class="logo-img" style="width: 150px;">
        </div>
        
        <a href="/" class="back-home"><i class="fas fa-arrow-left mr-2"></i> Quay lại trang chủ</a>
        
        <h2 class="page-title">PLAYFAIR CIPHER</h2>
        
        <div class="cipher-grid">
            <!-- ENCRYPTION CARD -->
            <div class="cipher-card">
                <h3 class="card-title encrypt-title"><i class="fas fa-lock mr-2"></i> ENCRYPTION</h3>
                <form method="POST" action="/playfair/encrypt">
                    <div class="form-group mb-3">
                        <label class="form-label">Plain text:</label>
                        <input type="text" class="form-control" name="inputPlainText" placeholder="Nhập bản rõ (A-Z)" value="{{inputPlainText}}" required autofocus/>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Key (String):</label>
                        <input type="text" class="form-control" name="inputKeyPlain" placeholder="Nhập khóa (chữ cái)" value="{{inputKeyPlain}}" required/>
                    </div>
                    <button type="submit" class="btn btn-primary mb-4">Encrypt</button>
                    
                    <div class="form-group mb-3">
                        <label class="form-label">Cipher text (Output):</label>
                        <input type="text" class="form-control" name="output" value="{{output}}" readonly/>
                    </div>
                </form>
            </div>
            
            <!-- DECRYPTION CARD -->
            <div class="cipher-card">
                <h3 class="card-title decrypt-title"><i class="fas fa-unlock mr-2"></i> DECRYPTION</h3>
                <form method="POST" action="/playfair/decrypt" onsubmit="prepareDecrypt()">
                    <input type="hidden" name="hiddenPlainText" id="hiddenPlainText" value="{{inputPlainText}}"/>
                    <input type="hidden" name="hiddenKeyPlain" id="hiddenKeyPlain" value="{{inputKeyPlain}}"/>
                    <input type="hidden" name="hiddenOutput" id="hiddenOutput" value="{{output}}"/>
                    <div class="form-group mb-3">
                        <label class="form-label">Cipher text:</label>
                        <input type="text" class="form-control" name="inputCipherText" placeholder="Nhập bản mã" value="{{inputCipherText}}" required/>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Key (String):</label>
                        <input type="text" class="form-control" name="inputKeyCipher" placeholder="Nhập khóa (chữ cái)" value="{{inputKeyCipher}}" required/>
                    </div>
                    <button type="submit" class="btn btn-success mb-4">Decrypt</button>
                    
                    <div class="form-group mb-3">
                        <label class="form-label">Plain text (Output):</label>
                        <input type="text" class="form-control" name="output" value="{{decrypted_text}}" readonly/>
                    </div>
                </form>
            </div>
        </div>

        {% if playfair_matrix %}
        <div class="cipher-card mt-4 mx-auto" style="max-width: 500px;">
            <h4 class="text-center mb-3" style="color: #a78bfa; font-weight: 600;"><i class="fas fa-border-all mr-2"></i> Playfair Matrix (5x5)</h4>
            <table class="playfair-grid-table">
                {% for row in playfair_matrix %}
                <tr>
                    {% for char in row %}
                    <td>{{ char }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </table>
        </div>
        {% endif %}
    </div>
    <script>
        function prepareDecrypt() {
            document.getElementById('hiddenPlainText').value = document.querySelector('input[name="inputPlainText"]').value;
            document.getElementById('hiddenKeyPlain').value = document.querySelector('input[name="inputKeyPlain"]').value;
            document.getElementById('hiddenOutput').value = document.querySelector('input[name="output"]').value;
        }
    </script>
</body>
</html>
